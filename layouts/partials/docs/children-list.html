{{ if .Pages }}
{{ range .Pages }}
<div style="display:flex; align-items:baseline; gap:1rem; padding:0.5rem 0; border-bottom:1px solid var(--gray-100);">
  <span style="white-space:nowrap; opacity:0.6; font-size:0.9em; width:12rem; flex:none;">
    {{- if .Params.date }}{{ partial "docs/date-range" . }}{{ end -}}
  </span>
  <a href="{{ .RelPermalink }}">{{ .Title }}</a>
</div>
{{ end }}
{{ end }}
